<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f1f4f6;
  --surface: #ffffff;
  --border: #d9dee3;
  --text: #303030;
  --text-muted: #9f9f9f;
  --accent: #00d7e6;
  --accent2: #ff5281;
  --radius: 5px;
  --shadow: 0 2px 16px rgba(48,48,48,0.06);
  --shadow-lg: 0 10px 32px rgba(48,48,48,0.10);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* ヘッダー */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 26px 60px;
  font-size: 14px;
  border-bottom: 1px solid var(--border);
}

.logo {
  font-family: 'Montserrat', sans-serif;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo::before {
  content: "";
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 5px;
  background: var(--accent);
}

.nav a {
  margin-left: 30px;
  text-decoration: none;
  color: var(--text-muted);
  font-weight: 500;
  transition: color 0.15s;
}

.nav a:hover {
  color: var(--accent);
}

/* メイン */
.main {
  padding: 100px 60px 120px;
  max-width: 1100px;
  margin: 0 auto;
}

.eyebrow {
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 18px;
}

.title {
  font-size: 44px;
  font-weight: 700;
  line-height: 1.45;
  letter-spacing: -0.01em;
  margin-bottom: 8px;
  color: var(--text);
}

/* カード */
.apps {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  margin-top: 64px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 32px 28px;
  border-radius: 5px;
  box-shadow: var(--shadow);
  text-decoration: none;
  color: var(--text);
  width: 270px;
  transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
  border-color: var(--accent);
}

.card-mark {
  width: 34px;
  height: 34px;
  border-radius: 5px;
  background: var(--accent);
  margin-bottom: 20px;
}

.card:nth-of-type(2) .card-mark,
.card[href="./InDesign_settings/InDesign_settings.html"] .card-mark,
.card[href="./Illustrator_settings/Illustrator_settings.html"] .card-mark,
.card[href="./Photoshop_settings/Photoshop_settings.html"] .card-mark {
  background: var(--accent2);
}

.card h2 {
  margin: 0 0 8px;
  font-size: 17px;
  font-weight: 700;
}

.card p {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.6;
  margin: 0;
}

.main .title { font-size: 24px; margin: 0 0 24px; }
:focus-visible { outline: 3px solid #185f83; outline-offset: 3px; }
@media(prefers-reduced-motion:reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
@media(max-width:600px) { .header { padding:20px 16px; } .main { padding:32px 16px 60px; } .apps { margin-top:24px; } .card { width:100%; } }
</style>
</head>

<body>

<div class="header">
  <div class="logo">My Tools</div>
  <div class="nav">
    <a href="#">一覧</a>
  </div>
</div>

<div class="main">
  <h1 class="title">ツール一覧</h1>

  <div class="apps">
    <a href="./F_App/F_App.html" class="card">
      <div class="card-mark"></div>
      <h2>F App</h2>
      <p>不動産向けツール集</p>
    </a>

    <a href="./Design_estimate/Design_estimate.html" class="card">
      <div class="card-mark"></div>
      <h2>デザイン制作費見積</h2>
      <p>制作費をシミュレーション</p>
    </a>
    <a href="./InDesign_settings/InDesign_settings.html" class="card"><div class="card-mark"></div><h2>InDesign</h2><p>設定・使い方メモ</p></a>
    <a href="./Illustrator_settings/Illustrator_settings.html" class="card"><div class="card-mark"></div><h2>Illustrator</h2><p>設定・使い方メモ</p></a>
    <a href="./Photoshop_settings/Photoshop_settings.html" class="card"><div class="card-mark"></div><h2>Photoshop</h2><p>設定・使い方メモ</p></a>
  </div>
</div>

</body>
</html>
